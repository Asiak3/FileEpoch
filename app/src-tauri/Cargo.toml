[package]
name = "fileepoch-app"
description = "FileEpoch desktop app: Time Machine-style browser for Kopia backups"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
kopia-client = { path = "../../crates/kopia-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
zeroize = "1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Only to remove the start-with-system entry of earlier versions (named "Rewind").
auto-launch = "0.5"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
# Thumbnails: decoders for common photo formats only.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
base64 = "0.22"

[features]
# Enabled by `tauri build`: serve the embedded frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
