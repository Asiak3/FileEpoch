  <path d="M106 452L286 452L196 586z" fill="#ffffff" opacity="0.95" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
  <!-- clock face -->
  <circle cx="512" cy="512" r="206" fill="url(#face)"/>
  <path d="M512 400v122l84 56" fill="none" stroke="#1450c8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
