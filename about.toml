# cargo-about: third-party license notices for FileEpoch (tools/third-party-notices.mjs).
# Only these licenses are accepted; a dependency under any other license makes generation fail,
# so a copyleft or unusual license cannot slip in unnoticed.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# Everything that ships in the desktop app and the CLI on all three systems.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Build and dev dependencies are not shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Known crates whose license files need help (cargo-about's built-in clarifications).
workarounds = ["rustls", "wasmtime"]

# ring's sources carry a license header in every file; use its license files instead.
# (The checksums make generation fail if the files change in a new version, so they get reviewed.)
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

[schemars_derive.clarify]
license = "MIT"

[[schemars_derive.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "1954992a2b32e8a2af24a4c11b726902e344c1934b947a77f04d404908f8db30"
